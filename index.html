<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/freelancers_hackathon/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IdeaForge - AI Project Idea Generator</title>
    <!-- Typography: Inter for a refined neutral UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/freelancers_hackathon/assets/index-CjO9MUGL.js"></script>
    <link rel="stylesheet" crossorigin href="/freelancers_hackathon/assets/index-CX34Vffd.css">
  </head>
  <body>
    <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020617;color:#fff;font-family:Inter,sans-serif;z-index:9999;overflow:hidden;">
      <style>
        :root { --p: #6366f1; --s: #a855f7; }
        .cosmic-container { position: relative; width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; animation: rotate var(--d) linear infinite; }
        .r1 { width: 100%; height: 100%; border-top-color: var(--p); --d: 2s; opacity: 0.8; }
        .r2 { width: 75%; height: 75%; border-bottom-color: var(--s); --d: 1.5s; animation-direction: reverse; opacity: 0.6; }
        .r3 { width: 50%; height: 50%; border-left-color: #fff; --d: 1s; opacity: 0.4; }
        .core { width: 12px; height: 12px; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff, 0 0 40px var(--p); animation: pulse 1s ease-in-out infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
        .status-box { margin-top: 40px; text-align: center; }
        .brand { font-weight: 900; font-size: 18px; letter-spacing: 0.4em; text-transform: uppercase; background: linear-gradient(to right, #6366f1, #a855f7); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
        .status-text { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; color: #475569; }
        .status-text::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80% { content: '...'; } }
      </style>
      <div class="cosmic-container">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="core"></div>
      </div>
      <div class="status-box">
        <div class="brand">IdeaForge</div>
        <div id="boot-status" class="status-text">Synchronizing AI Architect</div>
      </div>
      <script>
        const status = document.getElementById('boot-status');
        const phrases = ['Initializing Neural Core', 'Syncing Knowledge Base', 'Calibrating Multi-Agent Stack', 'Booting Visual Engine'];
        let i = 0;
        setInterval(() => { status.textContent = phrases[i++ % phrases.length]; }, 1000);
      </script>
    </div>
    <div id="root"></div>
  </body>
</html>
