# Prometheus ServiceMonitor for the backend service.
# The kube-prometheus-stack Helm chart installs the Prometheus Operator, which
# discovers scrape targets via ServiceMonitor resources.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: freelancers-app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# Grafana dashboard ConfigMap — pre-loads an application overview dashboard.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  app-overview.json: |
    {
      "title": "Application Overview",
      "uid": "app-overview",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "stat",
          "title": "Backend Pods Up",
          "id": 1,
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{deployment=\"backend-deployment\"}",
              "legendFormat": "available"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Frontend Pods Up",
          "id": 2,
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{deployment=\"frontend-deployment\"}",
              "legendFormat": "available"
            }
          ]
        },
        {
          "type": "graph",
          "title": "CPU Usage (all pods)",
          "id": 3,
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\"}[5m])) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "type": "graph",
          "title": "Memory Usage (all pods)",
          "id": 4,
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\", container!=\"\"}) by (pod)",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
