# ngrok agent deployment — exposes the frontend service via a public URL.
# Requires a Kubernetes secret named "ngrok-secret" with key "authtoken".
# The workflow creates this secret automatically from the NGROK_AUTHTOKEN GitHub secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok
  labels:
    app: ngrok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ngrok
  template:
    metadata:
      labels:
        app: ngrok
    spec:
      containers:
      - name: ngrok
        image: ngrok/ngrok:alpine
        args:
        - "http"
        - "frontend-service:80"
        - "--log=stdout"
        env:
        - name: NGROK_AUTHTOKEN
          valueFrom:
            secretKeyRef:
              name: ngrok-secret
              key: authtoken
        ports:
        - containerPort: 4040
          name: api
        readinessProbe:
          httpGet:
            path: /api/tunnels
            port: 4040
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ngrok-service
spec:
  selector:
    app: ngrok
  ports:
  - name: api
    port: 4040
    targetPort: 4040
