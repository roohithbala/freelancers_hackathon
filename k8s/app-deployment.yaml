apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app: freelancers-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  minReadySeconds: 10
  selector:
    matchLabels:
      app: freelancers-app
  template:
    metadata:
      labels:
        app: freelancers-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: app
        image: IMAGE_PLACEHOLDER_APP
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  type: NodePort
  selector:
    app: freelancers-app
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30050
