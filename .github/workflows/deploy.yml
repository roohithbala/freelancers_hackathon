name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-app
  BACKEND_ENV_B64: "SEZfQVBJX0tFWT1oZl9tVHVPUGJKQndwQ25Uek1MV2x3RFZncHlUY1NxRmxpRExDCkhGX01PREVMPWdvb2dsZS9mbGFuLXQ1LWxhcmdlClJBWk9SUEFZX0tFWV9JRD1yenBfdGVzdF9TTmRzZEFCQkFGSnNJbwpSQVpPUlBBWV9TRUNSRVQ9WE5IaGdsM0FxWFAzUWZwMDJnSDZJRXVC"
  FRONTEND_ENV_B64: ""
  EC2_PUBLIC_IP: "18.207.168.8"

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔹 Build consolidated application image (Internal Tag Only)
      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            FRONTEND_ENV_B64=${{ env.FRONTEND_ENV_B64 }}
            BACKEND_ENV_B64=${{ env.BACKEND_ENV_B64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          set -o pipefail
          mkdir -p ~/.kube
          
          if [ -z "${{ secrets.KUBECONFIG_B64 }}" ]; then
            echo "::error::GitHub Secret 'KUBECONFIG_B64' is missing or empty!"
            echo "Please go to Settings > Secrets and variables > Actions and add KUBECONFIG_B64."
            exit 1
          fi

          echo "${{ secrets.KUBECONFIG_B64 }}" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          
          if [ ! -s ~/.kube/config ]; then
            echo "::error::Kubeconfig file is empty after decoding! Verify your Base64 string."
            exit 1
          fi
          
          chmod 600 ~/.kube/config
          echo "✅ Kubeconfig configured successfully."

      - name: Cleanup old resources (Avoid NodePort and Resource conflicts)
        run: |
          kubectl delete service backend-service frontend-service --ignore-not-found=true
          kubectl delete deployment backend-deployment frontend-deployment --ignore-not-found=true

      - name: Deploy application
        run: |
          echo "🚀 Applying new deployment..."
          sed "s|IMAGE_PLACEHOLDER_APP|${{ env.APP_IMAGE }}:${{ github.sha }}|g" \
            k8s/app-deployment.yaml | kubectl apply --validate=false -f -
          
          # Wait for rollout and show status on failure
          if ! kubectl rollout status deployment/app-deployment --timeout=180s; then
            echo "::error::Rollout failed! Attempting automatic rollback..."
            kubectl get pods
            kubectl describe deployment app-deployment
            kubectl logs -l app=freelancers-app --tail=50
            
            # 🛡️ ROLLBACK
            kubectl rollout undo deployment/app-deployment
            kubectl rollout status deployment/app-deployment --timeout=120s
            echo "::notice::Successfully rolled back to the previous stable version."
            exit 1
          fi

      - name: Deploy nginx reverse proxy
        run: |
          echo "🧹 Force cleaning old proxy..."
          kubectl delete deployment nginx-proxy --ignore-not-found=true
          kubectl delete service nginx-proxy-service --ignore-not-found=true
          sleep 10
          
          echo "🚀 Applying nginx reverse proxy..."
          kubectl apply --validate=false -f k8s/nginx-proxy.yaml
          
          echo "⌛ Waiting for rollout (300s)..."
          if ! kubectl rollout status deployment/nginx-proxy --timeout=300s; then
            echo "::error::Nginx Proxy rollout failed!"
            echo "--- PODS ---"
            kubectl get pods -A
            echo "--- EVENTS ---"
            kubectl get events --sort-by='.lastTimestamp' | tail -n 20
            echo "--- DESCRIBE ---"
            kubectl describe pods -l app=nginx-proxy
            echo "--- LOGS ---"
            kubectl logs -l app=nginx-proxy --all-containers=true --tail=100
            exit 1
          fi

      - name: Promote to latest
        run: |
          echo "🏷️ Tagging image as latest..."
          docker pull ${{ env.APP_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.APP_IMAGE }}:${{ github.sha }} ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.APP_IMAGE }}:latest
          echo "✅ Successfully promoted to latest!"

      - name: Print deployment summary
        run: |
          echo "=============================="
          echo "  Deployment Summary"
          echo "=============================="
          echo ""
          kubectl get pods -o wide
          echo ""
          kubectl get services
          echo ""
          echo "🌐 Website:  http://${{ env.EC2_PUBLIC_IP }}"
          echo ""
          echo "=============================="

