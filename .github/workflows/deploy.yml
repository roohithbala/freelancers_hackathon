name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-app

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}, ${{ env.APP_IMAGE }}:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ghcr.io/${{ github.repository_owner }}/freelancers-app:${{ github.sha }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_MODEL: ${{ secrets.HF_MODEL }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Pass all variables as environment into the remote SSH session (no single-quoted heredoc)
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@3.238.174.159 \
            IMAGE_TAG="$IMAGE_TAG" \
            REPO_URL="$REPO_URL" \
            HF_API_KEY="$HF_API_KEY" \
            HF_MODEL="$HF_MODEL" \
            RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID" \
            RAZORPAY_SECRET="$RAZORPAY_SECRET" \
            GROQ_API_KEY="$GROQ_API_KEY" \
            GROQ_MODEL="$GROQ_MODEL" \
            bash << 'ENDSSH'
            set -e
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Ensure workspace exists and is up to date
            if [ ! -d "$HOME/freelancers_hackathon" ]; then
              git clone "$REPO_URL" "$HOME/freelancers_hackathon"
            fi
            cd "$HOME/freelancers_hackathon"
            git pull origin main || true

            # Create/update secrets
            kubectl create secret generic app-secrets \
              --from-literal=HF_API_KEY="$HF_API_KEY" \
              --from-literal=HF_MODEL="$HF_MODEL" \
              --from-literal=RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID" \
              --from-literal=RAZORPAY_SECRET="$RAZORPAY_SECRET" \
              --from-literal=GROQ_API_KEY="$GROQ_API_KEY" \
              --from-literal=GROQ_MODEL="$GROQ_MODEL" \
              --dry-run=client -o yaml | kubectl apply -f -

            # Only update secrets, monitoring, ingress (safe to apply)
            kubectl apply -f k8s/monitoring.yaml
            kubectl apply -f k8s/ingress.yaml

            # Rolling update: only swap the image — do NOT overwrite existing deployment spec
            kubectl set image deployment/app-deployment app="${IMAGE_TAG}"
            kubectl set image deployment/nginx-proxy nginx-proxy="${IMAGE_TAG}"

            # Wait for rollout to complete
            kubectl rollout status deployment/app-deployment --timeout=180s
            kubectl rollout status deployment/nginx-proxy --timeout=180s

            echo "=============================="
            echo "  Deployment Complete ✅"
            echo "=============================="
            kubectl get pods -A
            echo "🌐 Website:  http://3.238.174.159"
            echo "=============================="
          ENDSSH
