name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-backend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode frontend env for Docker build args
        id: frontend-env
        run: |
          echo "${{ secrets.FRONTEND_ENV_B64 }}" | base64 -d > /tmp/frontend.env
          # Export each VITE_ variable as a GitHub Actions output (multiline safe)
          {
            echo 'build_args<<EOF'
            grep -E '^VITE_' /tmp/frontend.env || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm -f /tmp/frontend.env

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: ${{ steps.frontend-env.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

      - name: Create backend secret
        run: |
          echo "${{ secrets.BACKEND_ENV_B64 }}" | base64 -d > /tmp/backend.env
          kubectl create secret generic backend-env \
            --from-env-file=/tmp/backend.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/backend.env

      - name: Create ngrok secret
        run: |
          kubectl create secret generic ngrok-secret \
            --from-literal=authtoken=${{ secrets.NGROK_AUTHTOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy backend
        run: |
          sed "s|IMAGE_PLACEHOLDER_BACKEND|${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" \
            k8s/backend-deployment.yaml | kubectl apply --validate=false -f -
          kubectl rollout restart deployment/backend-deployment
          kubectl rollout status deployment/backend-deployment --timeout=180s

      - name: Deploy frontend
        run: |
          sed "s|IMAGE_PLACEHOLDER_FRONTEND|${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" \
            k8s/frontend-deployment.yaml | kubectl apply --validate=false -f -
          kubectl rollout restart deployment/frontend-deployment
          kubectl rollout status deployment/frontend-deployment --timeout=180s

      - name: Deploy ngrok tunnel
        run: |
          kubectl apply --validate=false -f k8s/ngrok.yaml
          kubectl rollout status deployment/ngrok --timeout=120s

      - name: Apply Prometheus monitoring resources
        run: |
          kubectl apply --validate=false -f k8s/monitoring.yaml

      - name: Install Prometheus + Grafana via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set grafana.service.type=NodePort \
            --set grafana.service.nodePort=32000 \
            --timeout=300s \
            --wait

      - name: Get ngrok public URL
        id: ngrok-url
        run: |
          NGROK_POD=$(kubectl get pods -l app=ngrok -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
          if [ -z "$NGROK_POD" ]; then
            echo "ngrok_url=not-available" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Polling ngrok API for tunnel URL (up to 60s)..."
          NGROK_URL=""
          for i in $(seq 1 12); do
            NGROK_URL=$(kubectl exec "$NGROK_POD" -- \
              wget -qO- http://localhost:4040/api/tunnels 2>/dev/null \
              | grep -o '"public_url":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
            if [ -n "$NGROK_URL" ]; then
              break
            fi
            echo "  attempt $i/12 — tunnel not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "ngrok_url=${NGROK_URL:-not-available}" >> "$GITHUB_OUTPUT"
          echo "🌐 Public URL: ${NGROK_URL:-not-available}"

      - name: Print deployment summary
        run: |
          echo "=============================="
          echo "  Deployment Summary"
          echo "=============================="
          echo ""
          kubectl get pods -o wide
          echo ""
          kubectl get services
          echo ""
          echo "📊 Grafana:  http://<node-ip>:32000  (admin / \$GRAFANA_ADMIN_PASSWORD)"
          echo "🌐 Website:  ${{ steps.ngrok-url.outputs.ngrok_url }}"
          echo ""
          echo "=============================="

