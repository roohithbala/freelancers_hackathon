name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-app

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}, ${{ env.APP_IMAGE }}:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.VITE_RAZORPAY_KEY_ID }}
            VITE_API_BASE_URL=http://3.238.174.159/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2 via SSH
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa \
            ubuntu@3.238.174.159 << 'ENDSSH'

            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Create/update kubernetes secret from individual values
            kubectl create secret generic app-secrets \
              --from-literal=HF_API_KEY="${{ secrets.HF_API_KEY }}" \
              --from-literal=HF_MODEL="${{ secrets.HF_MODEL }}" \
              --from-literal=RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
              --from-literal=RAZORPAY_SECRET="${{ secrets.RAZORPAY_SECRET }}" \
              --from-literal=GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
              --from-literal=GROQ_MODEL="${{ secrets.GROQ_MODEL }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            # Pull latest manifests
            cd ~/freelancers_hackathon
            git pull origin main || true

            # Apply deployments
            sed "s|IMAGE_PLACEHOLDER_APP|ghcr.io/${{ github.repository_owner }}/freelancers-app:${{ github.sha }}|g" \
              k8s/app-deployment.yaml | kubectl apply -f -

            kubectl apply -f k8s/monitoring.yaml
            kubectl apply -f k8s/nginx-proxy.yaml
            kubectl apply -f k8s/ingress.yaml

            kubectl rollout status deployment/app-deployment --timeout=180s

            echo "=============================="
            echo "  Deployment Summary"
            echo "=============================="
            kubectl get pods -o wide
            kubectl get services
            echo "🌐 Website:     http://3.238.174.159"
            echo "📊 Grafana:     http://3.238.174.159:30030"
            echo "🔥 Prometheus:  http://3.238.174.159:30090"
            echo "=============================="
          ENDSSH
