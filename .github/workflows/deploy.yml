name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-backend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔹 Decode frontend env file
      - name: Decode frontend env for Docker build args
        id: frontend-env
        run: |
          echo "${{ secrets.FRONTEND_ENV_B64 }}" | base64 -d > /tmp/frontend.env
          # Export each VITE_ variable as a GitHub Actions output (multiline safe)
          {
            echo 'build_args<<EOF'
            grep -E '^VITE_' /tmp/frontend.env || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm -f /tmp/frontend.env

      # 🔹 Build frontend image with env variables
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: ${{ steps.frontend-env.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 🔹 Decode backend env file
      - name: Decode backend env for Docker build args
        id: backend-env
        run: |
          echo "${{ secrets.BACKEND_ENV_B64 }}" | base64 -d > /tmp/backend.env
          {
            echo 'build_args<<EOF'
            cat /tmp/backend.env || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          rm -f /tmp/backend.env

      # 🔹 Build backend image
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          build-args: ${{ steps.backend-env.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      KUBECONFIG_B64: ""
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "Checking KUBECONFIG_B64 length: ${#KUBECONFIG_B64}"
          if [ -z "$KUBECONFIG_B64" ] || [ "${#KUBECONFIG_B64}" -lt 50 ]; then
            echo "Error: KUBECONFIG_DATA secret is empty or too short. Length: ${#KUBECONFIG_B64}"
            exit 1
          fi
          echo "$KUBECONFIG_B64" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

          echo "Kubeconfig file size: $(stat -c%s ~/.kube/config) bytes"
          echo "Kubeconfig loaded:"
          kubectl config view
          kubectl config get-contexts
          kubectl cluster-info

      - name: Create monitoring namespace
        run: |
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

      # 🔹 Backend env secret
      - name: Create backend secret
        run: |
          echo "${{ secrets.BACKEND_ENV_B64 }}" | base64 -d > /tmp/backend.env
          kubectl create secret generic backend-env \
            --from-env-file=/tmp/backend.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/backend.env

      - name: Deploy backend
        run: |
          sed "s|IMAGE_PLACEHOLDER_BACKEND|${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" \
            k8s/backend-deployment.yaml | kubectl apply --validate=false -f -
          kubectl rollout status deployment/backend-deployment --timeout=180s

      # 🔹 Deploy frontend
      - name: Deploy frontend
        run: |
          sed "s|IMAGE_PLACEHOLDER_FRONTEND|${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" \
            k8s/frontend-deployment.yaml | kubectl apply --validate=false -f -
          kubectl rollout status deployment/frontend-deployment --timeout=180s

      - name: Deploy nginx reverse proxy
        run: |
          kubectl apply --validate=false -f k8s/nginx-proxy.yaml
          kubectl rollout status deployment/nginx-proxy --timeout=120s

      - name: Apply Prometheus monitoring resources
        run: |
          kubectl apply --validate=false -f k8s/monitoring.yaml

      - name: Install Prometheus + Grafana via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install kube-prometheus-stack \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --set grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
            --set grafana.service.type=NodePort \
            --set grafana.service.nodePort=32000 \
            --timeout=300s \
            --wait

      - name: Print deployment summary
        run: |
          echo "=============================="
          echo "  Deployment Summary"
          echo "=============================="
          echo ""
          kubectl get pods -o wide
          echo ""
          kubectl get services
          echo ""
          echo "📊 Grafana:  http://${{ secrets.EC2_PUBLIC_IP }}:32000  (admin / \$GRAFANA_ADMIN_PASSWORD)"
          echo "🌐 Website:  http://${{ secrets.EC2_PUBLIC_IP }}"
          echo ""
          echo "=============================="

