name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-app
  KUBECONFIG_B64: ""
  BACKEND_ENV_B64: "SEZfQVBJX0tFWT1oZl9tVHVPUGJKQndwQ25Uek1MV2x3RFZncHlUY1NxRmxpRExDCkhGX01PREVMPWdvb2dsZS9mbGFuLXQ1LWxhcmdlClJBWk9SUEFZX0tFWV9JRD1yenBfdGVzdF9TTmRzZEFCQkFGSnNJbwpSQVpPUlBBWV9TRUNSRVQ9WE5IaGdsM0FxWFAzUWZwMDJnSDZJRXVC"
  FRONTEND_ENV_B64: ""
  EC2_PUBLIC_IP: "18.234.65.179"

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔹 Build consolidated application image (Internal Tag Only)
      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            FRONTEND_ENV_B64=${{ env.FRONTEND_ENV_B64 }}
            BACKEND_ENV_B64=${{ env.BACKEND_ENV_B64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ env.KUBECONFIG_B64 }}" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy application
        run: |
          echo "🚀 Applying new deployment..."
          sed "s|IMAGE_PLACEHOLDER_APP|${{ env.APP_IMAGE }}:${{ github.sha }}|g" \
            k8s/app-deployment.yaml | kubectl apply --request-timeout=120s --validate=false -f -
          
          # Wait for rollout and show status on failure
          if ! kubectl rollout status deployment/app-deployment --timeout=180s; then
            echo "::error::Rollout failed! Attempting automatic rollback..."
            kubectl get pods
            kubectl describe deployment app-deployment
            kubectl logs -l app=freelancers-app --tail=50
            
            # 🛡️ ROLLBACK
            kubectl rollout undo deployment/app-deployment
            kubectl rollout status deployment/app-deployment --timeout=120s
            echo "::notice::Successfully rolled back to the previous stable version."
            exit 1
          fi

      - name: Deploy Nginx Proxy and Ingress (Port 80 routing)
        run: |
          kubectl apply --request-timeout=120s --validate=false -f k8s/nginx-proxy.yaml
          kubectl apply --request-timeout=120s --validate=false -f k8s/ingress.yaml

      - name: Setup Monitoring Stack (Optimized for t3.micro)
        run: |
          echo "📊 Setting up Monitoring Stack..."
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          
          # Minimal values for t3.micro (1GiB RAM)
          cat <<EOF > monitoring-values.yaml
          prometheus:
            prometheusSpec:
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "50m"
                limits:
                  memory: "512Mi"
                  cpu: "200m"
              retention: 1d
              storageSpec:
                emptyDir:
                  medium: ""
          grafana:
            resources:
              requests:
                memory: "128Mi"
                cpu: "50m"
              limits:
                memory: "256Mi"
                cpu: "200m"
            service:
              type: ClusterIP
          alertmanager:
            enabled: false
          prometheus-node-exporter:
            resources:
              limits:
                memory: "50Mi"
          kube-state-metrics:
            resources:
              limits:
                memory: "100Mi"
          EOF
          
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring --create-namespace \
            -f monitoring-values.yaml --request-timeout=300s
            
          kubectl apply -f k8s/monitoring.yaml
          
          echo "🔑 Grafana Admin Password:"
          kubectl get secret --namespace monitoring prometheus-grafana -o jsonpath="{.data.admin-password}" | base64 --decode ; echo ""

      - name: Promote to latest
        run: |
          echo "🏷️ Tagging image as latest..."
          docker pull ${{ env.APP_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.APP_IMAGE }}:${{ github.sha }} ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.APP_IMAGE }}:latest
          echo "✅ Successfully promoted to latest!"


      - name: Print deployment summary
        run: |
          echo "=============================="
          echo "  Deployment Summary"
          echo "=============================="
          echo ""
          kubectl get pods -o wide
          echo ""
          kubectl get services
          echo ""
          echo "🌐 Website:  http://${{ env.EC2_PUBLIC_IP }}"
          echo ""
          echo "=============================="

