name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/freelancers-app
  KUBECONFIG_B64: ""
  BACKEND_ENV_B64: "SEZfQVBJX0tFWT1oZl9tVHVPUGJKQndwQ25Uek1MV2x3RFZncHlUY1NxRmxpRExDCkhGX01PREVMPWdvb2dsZS9mbGFuLXQ1LWxhcmdlClJBWk9SUEFZX0tFWV9JRD1yenBfdGVzdF9TTmRzZEFCQkFGSnNJbwpSQVpPUlBBWV9TRUNSRVQ9WE5IaGdsM0FxWFAzUWZwMDJnSDZJRXVC"
  FRONTEND_ENV_B64: ""
  EC2_PUBLIC_IP: "100.54.245.153"

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔹 Build consolidated application image (Internal Tag Only)
      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            FRONTEND_ENV_B64=${{ env.FRONTEND_ENV_B64 }}
            BACKEND_ENV_B64=${{ env.BACKEND_ENV_B64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ env.KUBECONFIG_B64 }}" | tr -d '[:space:]' | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Restore Node State (Aggressive Disk Cleanup)
        run: |
          echo "🧹 Purging all non-running and evicted pods..."
          kubectl delete pods --all --force --grace-period=0 || true
          
          echo "🗑️ Deleting all old ReplicaSets to release image references..."
          kubectl delete rs --all || true
          
          echo "💾 Checking Memory & Disk Space..."
          kubectl top nodes || echo "Metrics API not available"
          df -h | grep -E '^/dev/|Filesystem|overlay'
          
          echo "⏳ Waiting 10s for cluster to stabilize..."
          sleep 10

      - name: Force Untaint Nodes (Allow scheduling on t3.micro)
        run: |
          echo "🔓 Removing NoSchedule taints from all nodes..."
          # Allow scheduling on control-plane/master nodes
          kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
          kubectl taint nodes --all node-role.kubernetes.io/master- || true
          
          # Forcefully remove pressure taints
          kubectl taint nodes --all node.kubernetes.io/disk-pressure- || true
          kubectl taint nodes --all node.kubernetes.io/memory-pressure- || true
          kubectl taint nodes --all node.kubernetes.io/unschedulable- || true

      - name: Deploy application
        run: |
          echo "🚀 Applying new deployment..."
          sed "s|IMAGE_PLACEHOLDER_APP|${{ env.APP_IMAGE }}:${{ github.sha }}|g" \
            k8s/app-deployment.yaml | kubectl apply --request-timeout=120s --validate=false -f -
          
          # Show live status for transparency
          kubectl get pods -w & PID=$!
          
          # Wait for rollout and show status on failure
          if ! kubectl rollout status deployment/app-deployment --timeout=180s; then
            kill $PID
            echo "::error::Rollout failed! Showing diagnostics..."
            kubectl get pods
            kubectl describe pods
            kubectl describe nodes | grep -A 20 "Capacity"
            kubectl get events --sort-by='.lastTimestamp' | tail -n 20
            
            # 🛡️ ROLLBACK (Restored from successful commit behavior)
            kubectl rollout undo deployment/app-deployment
            kubectl rollout status deployment/app-deployment --timeout=120s
            exit 1
          fi
          kill $PID

      - name: Deploy Nginx Proxy and Ingress (Port 80 routing)
        run: |
          kubectl apply --request-timeout=120s --validate=false -f k8s/nginx-proxy.yaml
          kubectl apply --request-timeout=120s --validate=false -f k8s/ingress.yaml

      - name: Promote to latest
        run: |
          echo "🏷️ Tagging image as latest..."
          docker pull ${{ env.APP_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.APP_IMAGE }}:${{ github.sha }} ${{ env.APP_IMAGE }}:latest
          docker push ${{ env.APP_IMAGE }}:latest
          echo "✅ Successfully promoted to latest!"


      - name: Print deployment summary
        run: |
          echo "=============================="
          echo "  Deployment Summary"
          echo "=============================="
          echo ""
          kubectl get pods -o wide
          echo ""
          kubectl get services
          echo ""
          echo "🌐 Website:  http://${{ env.EC2_PUBLIC_IP }}"
          echo ""
          echo "=============================="

